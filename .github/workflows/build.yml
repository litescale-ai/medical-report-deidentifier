name: Build Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget libssl-dev libgtk-3-dev libayataka-dev libpango1.0-dev libglib2.0-dev libsoup2.4-dev appmenu-gtk3-module

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar (Mac)
        if: matrix.platform == 'macos-latest'
        run: |
          pyinstaller medical_deidentifier.spec
          cp dist/medical_deidentifier_backend src-tauri/medical_deidentifier_backend-aarch64-apple-darwin
          cp dist/medical_deidentifier_backend src-tauri/medical_deidentifier_backend-x86_64-apple-darwin

      - name: Build Python Sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          pyinstaller medical_deidentifier.spec
          copy dist\medical_deidentifier_backend.exe src-tauri\medical_deidentifier_backend-x86_64-pc-windows-msvc.exe

      - name: Install Tauri CLI
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: "Automated Release"
          releaseDraft: true
          prerelease: false
